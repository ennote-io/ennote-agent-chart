name: Release and Sign Helm Chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Install Crane
        uses: imjasonh/setup-crane@v0.7

      - name: Lint Helm Chart
        run: helm lint .

      - name: Format Chart Version
        id: vars
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CHART_NAME=$(helm show chart . | awk '/^name:/ {print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "chart_name=$CHART_NAME" >> $GITHUB_OUTPUT

      - name: Package Helm Chart
        run: |
          helm package . --version ${{ steps.vars.outputs.version }} --app-version ${{ steps.vars.outputs.version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Chart to GHCR
        id: push_chart
        run: |
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          helm push ${{ steps.vars.outputs.chart_name }}-${{ steps.vars.outputs.version }}.tgz oci://ghcr.io/$REPO/charts

          DIGEST=$(crane digest ghcr.io/$REPO/charts/${{ steps.vars.outputs.chart_name }}:${{ steps.vars.outputs.version }})
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not resolve digest for pushed chart"
            exit 1
          fi
          echo "Resolved digest: $DIGEST"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "repo_lower=$REPO" >> $GITHUB_OUTPUT

      - name: Tag Chart as Latest
        run: |
          crane tag ghcr.io/${{ steps.push_chart.outputs.repo_lower }}/charts/${{ steps.vars.outputs.chart_name }}@${{ steps.push_chart.outputs.digest }} latest

      - name: Sign the OCI Artifact
        run: |
          cosign sign --yes ghcr.io/${{ steps.push_chart.outputs.repo_lower }}/charts/${{ steps.vars.outputs.chart_name }}@${{ steps.push_chart.outputs.digest }}